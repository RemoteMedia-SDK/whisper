[package]
name = "whisper-loadable-plugin"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace so this crate doesn't get pulled into the main
# workspace build (and so the cdylib + heavy candle deps don't pollute
# the main `target/` dir for unrelated work).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `plugin_export!()` walks the inventory and emits the abi_stable
# root module the host loads via `dlopen`.
remotemedia-plugin-sdk = { git = "https://github.com/RemoteMedia-SDK/remotemedia-plugin-sdk", rev = "740b847f252551acd6f22156e6fb46a680b97659" }

# `abi_stable` must be a direct dep so the attribute macros expanded
# by `plugin_export!()` (`#[sabi_extern_fn]`, `#[export_root_module]`)
# can resolve `::abi_stable` at the crate root.
abi_stable = "0.11"

# Same trick the `#[node]` macro relies on: the
# `inventory::submit!{ LoadableFactoryEntry { ... } }` line emitted
# by candle-nodes only survives the cdylib link if some symbol from
# candle-nodes is actually referenced by this crate (see
# src/lib.rs::_force_link_whisper_factory).
#
# `inventory` itself isn't a direct dep — we just need it transitively
# through candle-nodes / plugin-sdk for the `iter` call inside
# `plugin_export!()` to compile. No extra dep entry required here.

# WhisperNode lives in candle-nodes. Turning the `loadable-export`
# feature on flips the `#[node]` macro's conditional FFI emission so
# the inventory contains a `LoadableFactoryEntry` for `WhisperNode`.
# Candle is pure Rust, so the same backend builds for Android.
remotemedia-candle-nodes = { git = "https://github.com/RemoteMedia-SDK/candle-nodes.git", rev = "dee700942ba8208acf3a9657c20fd7ae93f2311a", features = ["whisper", "loadable-export"] }

[patch."https://github.com/RemoteMedia-SDK/remotemedia-sdk-base"]
remotemedia-sdk-base = { path = "../remotemedia-sdk-base" }

[patch."https://github.com/RemoteMedia-SDK/remotemedia-plugin-sdk"]
remotemedia-plugin-sdk = { path = "../remotemedia-plugin-sdk/crates/plugin-sdk" }
remotemedia-traits = { path = "../remotemedia-plugin-sdk/crates/traits" }
remotemedia-types = { path = "../remotemedia-plugin-sdk/crates/types" }
loadable-node-abi = { path = "../remotemedia-plugin-sdk/crates/loadable-node-abi" }
# candle-nodes reaches the shared transcript stabilizer through remotemedia-modality,
# and remotemedia-sdk-base also depends on these: one copy, the sibling checkout.
remotemedia-modality = { path = "../remotemedia-plugin-sdk/crates/modality" }
remotemedia-core-derive = { path = "../remotemedia-plugin-sdk/crates/core-derive" }
remotemedia-py-env = { path = "../remotemedia-plugin-sdk/crates/py-env-manager" }

[patch."https://github.com/RemoteMedia-SDK/candle-nodes.git"]
remotemedia-candle-nodes = { path = "../candle-nodes" }

[patch.crates-io]
remotemedia-plugin-sdk = { path = "../remotemedia-plugin-sdk/crates/plugin-sdk" }
remotemedia-traits = { path = "../remotemedia-plugin-sdk/crates/traits" }
remotemedia-types = { path = "../remotemedia-plugin-sdk/crates/types" }
loadable-node-abi = { path = "../remotemedia-plugin-sdk/crates/loadable-node-abi" }
