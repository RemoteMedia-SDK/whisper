[package]
name = "whisper-loadable-plugin"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace so this crate doesn't get pulled into the main
# workspace build (and so the cdylib + heavy candle deps don't pollute
# the main `target/` dir for unrelated work).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# WhisperNode lives in candle-nodes. Turning the `loadable-export`
# feature on flips the `#[node]` macro's conditional FFI emission so
# the inventory contains a `LoadableFactoryEntry` for `WhisperNode`.
remotemedia-candle-nodes = { git = "https://github.com/matbeedotcom/remotemedia-sdk.git", rev = "a1f365e40a598645655cb5269b09c60096a24f43", features = ["whisper", "loadable-export"] }

# `plugin_export!()` walks the inventory and emits the abi_stable
# root module the host loads via `dlopen`.
remotemedia-plugin-sdk = { git = "https://github.com/matbeedotcom/remotemedia-sdk.git", rev = "a1f365e40a598645655cb5269b09c60096a24f43" }

# `abi_stable` must be a direct dep so the attribute macros expanded
# by `plugin_export!()` (`#[sabi_extern_fn]`, `#[export_root_module]`)
# can resolve `::abi_stable` at the crate root.
abi_stable = "0.11"

# Same trick the `#[node]` macro relies on: the
# `inventory::submit!{ LoadableFactoryEntry { ... } }` line emitted
# by candle-nodes only survives the cdylib link if some symbol from
# candle-nodes is actually referenced by this crate (see
# src/lib.rs::_force_link_whisper_factory).
#
# `inventory` itself isn't a direct dep — we just need it transitively
# through candle-nodes / plugin-sdk for the `iter` call inside
# `plugin_export!()` to compile. No extra dep entry required here.

